name: render/pusht/decoder_story_figures/render
kind: command
operation: render
context:
  phase_b_dir: "{run_root}/pusht_probe_phase_b"
  phase_b_probe_ckpt: "{run_root}/pusht_probe_phase_b/pusht_probe_phase_b_probe.pt"
  teacher_artifact: "{repro_root}/pusht_offline_diagnostics/teacher_vs_open_loop_d50_hh2_lh2.npz"
  generated_artifact: "{repro_root}/pusht_acting_diagnostics/generated_subgoal_acting_d50_hh2_lh2_lrh1.npz"
  online_artifact: "{repro_root}/pusht_acting_diagnostics/online_hierarchical_logging_d50_hh2_lh2_lrh1.npz"
outputs:
  root_kind: repro
  root_name: pusht_decoder_story_figures
  completion_file: "{output_root}/COMPLETE"
  expected_paths:
    - "{output_root}/manifest.json"
    - "{output_root}/teacher_vs_open_loop"
    - "{output_root}/generated_subgoal_acting"
    - "{output_root}/online_hierarchical_logging"
requirements:
  checkpoints:
    - "{run_root}/pusht_probe_phase_b/pusht_probe_phase_b_probe.pt"
command:
  argv:
    - python
    - scripts/diagnostics/render_hi_decoder_diagnostic_stories.py
    - --probe-run-dir
    - "{phase_b_dir}"
    - --probe-ckpt
    - "{phase_b_probe_ckpt}"
    - --teacher-artifact
    - "{teacher_artifact}"
    - --generated-artifact
    - "{generated_artifact}"
    - --online-artifact
    - "{online_artifact}"
    - --output-dir
    - "{output_root}"
    - --cache-dir
    - "{stablewm_home}"
    - --goal-offset-steps
    - "50"
    - --frame-skip
    - "5"
