name: render/pusht/paper_diagnostics/render
kind: command
operation: render
context:
  offline_root: "{repro_root}/pusht_offline_diagnostics"
  acting_root: "{repro_root}/pusht_acting_diagnostics"
  matrix_summary: "{repro_root}/matrix__pusht__hierarchical/summary.csv"
  baseline_summary: "{repro_root}/matrix__pusht__baseline/summary.csv"
outputs:
  root_kind: repro
  root_name: pusht_paper_diagnostics_render
  completion_file: "{output_root}/COMPLETE"
  expected_paths:
    - "{output_root}/manifest.json"
    - "{output_root}/figures/teacher_vs_open_loop.png"
    - "{output_root}/tables/teacher_vs_open_loop.csv"
    - "{output_root}/tables/oracle_subgoal_acting.csv"
    - "{output_root}/tables/generated_subgoal_acting.csv"
    - "{output_root}/tables/online_hierarchical_logging.csv"
command:
  argv:
    - python
    - scripts/diagnostics/render_hi_paper_diagnostics.py
    - --offline-log-root
    - "{offline_root}"
    - --acting-log-root
    - "{acting_root}"
    - --output-dir
    - "{output_root}"
    - --matrix-csv
    - "{matrix_summary}"
    - --baseline-md
    - "{baseline_summary}"
