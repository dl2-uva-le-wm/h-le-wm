name: probe/pusht/phase_a/train
kind: command
operation: train
outputs:
  root_kind: runs
  root_name: pusht_probe_phase_a
  completion_file: "{output_root}/COMPLETE"
requirements:
  checkpoints:
    - "{run_root}/pusht_hierarchical_hope2/pusht_hierarchical_hope2_epoch_15_object.ckpt"
command:
  argv:
    - python
    - -m
    - h_le_wm.probe.train
    - data=hi_pusht
    - output_model_name=pusht_probe_phase_a
    - subdir=runs/pusht_probe_phase_a
    - trainer.max_epochs=10
    - trainer.devices=1
    - trainer.accelerator=gpu
    - wandb.enabled=False
    - probe.mode=true_only
    - probe.checkpoint.path={run_root}/pusht_hierarchical_hope2/pusht_hierarchical_hope2_epoch_15_object.ckpt
