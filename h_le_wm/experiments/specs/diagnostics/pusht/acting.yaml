name: diagnostics/pusht/acting
kind: command
operation: diagnostics
outputs:
  root_kind: repro
  root_name: pusht_acting_diagnostics
  completion_file: "{output_root}/COMPLETE"
requirements:
  checkpoints:
    - "{run_root}/pusht_hierarchical_hope2/pusht_hierarchical_hope2_epoch_15_object.ckpt"
command:
  argv:
    - python
    - -m
    - h_le_wm.experiments.pusht_diagnostics
    - acting
    - --policy
    - runs/pusht_hierarchical_hope2/pusht_hierarchical_hope2_epoch_15
    - --output-root
    - "{output_root}"
    - --cache-dir
    - "{stablewm_home}"
    - --device
    - cuda
    - --seed
    - "42"
