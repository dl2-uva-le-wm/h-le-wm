name: baseline-integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Baseline Integrity
        run: python scripts/check_baseline_integrity.py

      - name: Wrapper Smoke (dry-run)
        env:
          LEWM_WRAPPER_DRY_RUN: "1"
        run: |
          python -m h_le_wm.train.baseline data=pusht
          python -m h_le_wm.eval.baseline --config-name=pusht

      - name: Hierarchy Compile Smoke
        run: python -m py_compile h_le_wm/baseline/adapter.py h_le_wm/models/latent_action.py h_le_wm/models/jepa.py h_le_wm/train/hierarchical.py h_le_wm/eval/hierarchical.py
